<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>{% if page.title %}{{ page.title }} | IMRango{% else %}Bra Size Calculator & Fit Guides | IMRango{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}Bra size calculators, sister size conversions, fit guidance, and sizing references for US, UK, EU, AU and related sizing systems.{% endif %}">

{% assign page_slug = page.url | replace: '.html', '' %}
{% if page_slug == '/index' or page_slug == '' %}
  {% assign canonical_url = "https://iamrango.com/" %}
{% else %}
  {% assign canonical_url = "https://iamrango.com" | append: page_slug %}
{% endif %}
<link rel="canonical" href="{{ canonical_url }}">

<meta property="og:site_name" content="IMRango">
<meta property="og:type" content="{% if page.layout == 'guide' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} | IMRango{% else %}Bra Size Calculator & Fit Guides | IMRango{% endif %}">
<meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}Measurement-based bra sizing references and fit guidance.{% endif %}">
<meta property="og:url" content="{{ canonical_url }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} | IMRango{% else %}Bra Size Calculator & Fit Guides | IMRango{% endif %}">
<meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}Precision bra sizing and fit intelligence.{% endif %}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css">
