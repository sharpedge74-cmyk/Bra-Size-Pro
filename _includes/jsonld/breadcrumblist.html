{% assign page_slug = page.url | replace: '.html', '' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type":"ListItem","position":1,"name":"Home","item":"https://iamrango.com/"}
    {% if page_slug != '/' and page_slug != '' %}
    {% if page.layout == 'tool' %},
    {"@type":"ListItem","position":2,"name":"Sizing Tools","item":"https://iamrango.com/bra-size-calculator"},
    {"@type":"ListItem","position":3,"name":{{ page.breadcrumb_label | default: page.title | jsonify }},"item":"https://iamrango.com{{ page_slug }}"}
    {% elsif page.layout == 'guide' %},
    {"@type":"ListItem","position":2,"name":"Sizing Guides","item":"https://iamrango.com/bra-sizing-methodology"},
    {"@type":"ListItem","position":3,"name":{{ page.breadcrumb_label | default: page.title | jsonify }},"item":"https://iamrango.com{{ page_slug }}"}
    {% else %},
    {"@type":"ListItem","position":2,"name":{{ page.breadcrumb_label | default: page.title | jsonify }},"item":"https://iamrango.com{{ page_slug }}"}
    {% endif %}
    {% endif %}
  ]
}
</script>
