- code: "us"
  name: "United States & Canada"
  band_system: "Inches (direct band measurement)"
  cup_progression: "AA, A, B, C, D, DD, DDD/F, G, H, I, J, K, L"
  unit_default: "inches"

- code: "uk"
  name: "United Kingdom"
  band_system: "Inches (firm underbust)"
  cup_progression: "AA, A, B, C, D, DD, E, F, FF, G, GG, H, HH, J, JJ"
  unit_default: "inches"

- code: "eu"
  name: "European Union"
  band_system: "Centimeters (underbust rounded to nearest 5cm)"
  cup_progression: "AA, A, B, C, D, E, F, G, H, I, J, K, L"
  unit_default: "cm"

- code: "au"
  name: "Australia & New Zealand"
  band_system: "Dress sizing bands (6, 8, 10, 12, 14, 16, 18, 20...)"
  cup_progression: "AA, A, B, C, D, DD, E, F, FF, G, GG, H"
  unit_default: "cm"

- code: "fr"
  name: "France & Spain"
  band_system: "Metric bands (+15 cm offset over EU band)"
  cup_progression: "AA, A, B, C, D, E, F, G, H"
  unit_default: "cm"

- code: "it"
  name: "Italy"
  band_system: "Ordinal band system (1 to 8)"
  cup_progression: "A, B, C, D, E, F"
  unit_default: "cm"

- code: "jp"
  name: "Japan"
  band_system: "Centimeters (65, 70, 75, 80... with snug band cut)"
  cup_progression: "AA, A, B, C, D, E, F, G, H"
  unit_default: "cm"
