- id: "panache"
  name: "Panache"
  origin: "UK"
  sizing_system: "uk"
  band_fit: "Firm / Snug"
  cup_depth: "Deep & Projected"
  wire_width: "Narrow to Medium"
  notes: "Panache uses UK sizing across all items. Bands are engineered firm for maximum support. If between band sizes, size up in the band."

- id: "freya"
  name: "Freya"
  origin: "UK"
  sizing_system: "uk"
  band_fit: "True to size / slightly stretchy"
  cup_depth: "Projected"
  wire_width: "Medium to Wide"
  notes: "Popular for youth and average-to-full busts. Wires are slightly softer and wider than Panache."

- id: "wacoal"
  name: "Wacoal"
  origin: "US"
  sizing_system: "us"
  band_fit: "Firm / Runs small"
  cup_depth: "Average to Shallow"
  wire_width: "Wide"
  notes: "Wacoal bands tend to run snug with low stretch. Many customers prefer taking one sister size up in the band."

- id: "victorias-secret"
  name: "Victoria's Secret"
  origin: "US"
  sizing_system: "us"
  band_fit: "Very Stretchy / Vanity Fit"
  cup_depth: "Shallow to Average"
  wire_width: "Average"
  notes: "Historically tends to push consumers into +4 band sizing with too-small cups. Bands stretch out rapidly; choose a snug band."

- id: "natori"
  name: "Natori"
  origin: "US"
  sizing_system: "us"
  band_fit: "True to size"
  cup_depth: "Shallow"
  wire_width: "Wide"
  notes: "Iconic Feathers bra is very shallow at the wire. If full on bottom or projected, consider sizing up one cup size."

- id: "thirdlove"
  name: "ThirdLove"
  origin: "US"
  sizing_system: "us"
  band_fit: "True to size"
  cup_depth: "Average"
  wire_width: "Average"
  notes: "Features exclusive half-cup sizes (e.g. B 1/2, C 1/2, D 1/2) for fine-tuned precision when between standard cups."

- id: "aerie"
  name: "Aerie"
  origin: "US"
  sizing_system: "us"
  band_fit: "Soft / Stretchy"
  cup_depth: "Average"
  wire_width: "Average"
  notes: "Comfort-oriented fabrics with forgiving band elasticity. True to size for A-DD cups."

- id: "skims"
  name: "Skims"
  origin: "US"
  sizing_system: "us"
  band_fit: "Runs snug / Compressive"
  cup_depth: "Shallow to Average"
  wire_width: "Flexible"
  notes: "Designed for sculpting compression. Many users find bands run 0.5 to 1 size tight."

- id: "elomi"
  name: "Elomi"
  origin: "UK"
  sizing_system: "uk"
  band_fit: "True to size / Supportive"
  cup_depth: "Deep"
  wire_width: "Wide & Low Center"
  notes: "Engineered specifically for plus sizes and full figures (bands 32-48, cups D-K). Excellent gore tacking and wing stability."

- id: "curvy-kate"
  name: "Curvy Kate"
  origin: "UK"
  sizing_system: "uk"
