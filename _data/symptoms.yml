- id: "band_rides_up"
  location: "back_band"
  title: "Band rides up towards shoulder blades"
  severity: "high"
  cause: "A band that rides up can be too loose, but strap adjustment, cup fit, and garment construction can also affect how it sits."
  fix: "Compare a smaller band with the corresponding cup step if the cups otherwise fit; also check whether cup shape or construction is contributing to the problem."

- id: "band_digs_painfully"
  location: "ribcage"
  title: "Band feels painfully tight or leaves deep welts"
  severity: "high"
  cause: "The band may be too firm, or the cups and wire shape may be pushing or pulling the garment out of position. One symptom cannot identify the cause by itself."
  fix: "Stop wearing a bra that causes ongoing pain or skin injury. Check band comfort, cup coverage, and wire position, then compare another size or style. If pain persists, consult a qualified clinician."

- id: "straps_slipping"
  location: "straps"
  title: "Shoulder straps repeatedly slide down"
  severity: "medium"
  cause: "Loose band allowing the back to rise and slacken straps, or straps set too far apart for narrow shoulders."
  fix: "Check strap adjustment and whether the band stays in place. A different strap placement or garment design may help; do not assume a smaller band is always the answer."

- id: "straps_digging"
  location: "straps"
  title: "Straps dig painfully into shoulders / leave red grooves"
  severity: "high"
  cause: "Strap pressure can have several causes, including strap adjustment, band fit, cup fit, and garment design. Check the band and cups together before changing size."
  fix: "If the cups fit, a sister-size comparison may help. Do not assume one size change is appropriate without checking the overall garment fit."

- id: "quad_boob_spillage"
  location: "cups"
  title: "Breast tissue spills over top or sides of cups (double-boob)"
  severity: "high"
  cause: "The cup volume is too small, or the cup neckline is too closed/restrictive for your upper fullness."
  fix: "Compare an adjacent cup size and a different cup shape or neckline. Check the overall fit before deciding that cup volume alone is the issue."

- id: "cup_gaping_wrinkling"
  location: "cups"
  title: "Cups gap, wrinkle, or have empty space at the top"
  severity: "medium"
  cause: "Gaping or wrinkles can relate to cup volume, cup shape, band position, or bra construction."
  fix: "Check whether the band stays in place and the cups are positioned correctly. Compare another cup size or shape; molded and seamed cups can fit differently."

- id: "wires_poking_breast"
  location: "underwire"
  title: "Underwire pokes breast tissue under armpits or on side"
  severity: "high"
  cause: "The wire may be too narrow, the cup may not contain the breast tissue, or the garment's shape may not suit the wearer."
  fix: "Do not keep wearing a wire that presses painfully on breast tissue. Compare wire width, cup coverage, and another style. Seek clinical advice for ongoing pain or a new lump."

- id: "gore_floating"
  location: "center_gore"
  title: "Center gore (bridge between cups) does not touch sternum"
  severity: "high"
  cause: "The cups are too small or shallow, forcing the bridge away from your chest wall. The band may also be too loose."
  fix: "A floating center front can relate to cup volume, cup depth, wire shape, band tension, or garment construction."

- id: "wires_slide_down"
  location: "underwire"
  title: "Underwires slide down onto stomach below inframammary fold"
  severity: "medium"
  cause: "Cups are too shallow right at the wire (immediate projection missing), or band is too tight pushing wires down."
  fix: "Consider styles with different lower-cup projection or construction, and compare the wire position and band fit on the specific garment."
