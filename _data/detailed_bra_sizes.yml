bands:
  - band: "26"
    descriptor: "very narrow band reference"
    context: "A 26 band sits at the narrow end of this guide. The number is the band part of the size, so it should be considered alongside the cup rather than read as a standalone measurement."
  - band: "28"
    descriptor: "narrow band reference"
    context: "A 28 band is designed around a narrower ribcage than the mid-range bands in this guide. Band stability is especially important because a cup can appear wrong when the band is not anchored correctly."
  - band: "30"
    descriptor: "small band reference"
    context: "A 30 band represents a relatively narrow ribcage. At this band, the same cup letter describes a smaller cup than it would on a wider band, which is why the number and letter need to be read together."
  - band: "32"
    descriptor: "smaller mid-range band reference"
    context: "A 32 band sits around the lower-middle part of this guide. It is useful as a familiar reference point for seeing how the same cup letter changes as the band moves up or down."
  - band: "34"
    descriptor: "mid-range band reference"
    context: "A 34 band provides a useful middle reference for comparing cup labels. The cup letter is still relative to this band, so a 34D is not interchangeable with every other D cup."
  - band: "36"
    descriptor: "mid-range band reference"
    context: "A 36 band is one of the broader everyday reference points in the guide. Moving to or from this band changes the proportions of the bra even when the cup letter stays the same."
  - band: "38"
    descriptor: "broader band reference"
    context: "A 38 band is wider than the smaller bands above it. The cup attached to it should be judged as part of the complete size, not as an isolated volume label."
  - band: "40"
    descriptor: "wide band reference"
    context: "A 40 band gives a wider ribcage reference. At this band, cup volume and wire dimensions can be quite different from a smaller band carrying the same cup letter."
  - band: "42"
    descriptor: "wider band reference"
    context: "A 42 band sits firmly in the wider end of this size range. Fit depends on how the underband sits around the ribcage as well as how the cups contain the bust."
  - band: "44"
    descriptor: "wide band reference"
    context: "A 44 band provides a broad underband reference. The cup letter still moves through the same sequence in this guide, but the physical proportions of the finished bra change with the band."
  - band: "46"
    descriptor: "very wide band reference"
    context: "A 46 band is intended as a wider-band reference. A well-fitting cup and a stable band need to work together; changing only one part of the size can change the balance of the whole garment."
  - band: "48"
    descriptor: "very wide band reference"
    context: "A 48 band represents a substantially wider band. The size should be evaluated as a complete combination because the cup dimensions associated with a letter change as the band changes."
  - band: "50"
    descriptor: "extra-wide band reference"
    context: "A 50 band is near the upper end of the bands covered here. Construction, elastic stretch and wire width become especially useful things to check when comparing real bras."
  - band: "52"
    descriptor: "extra-wide band reference"
    context: "A 52 band is the widest band in this guide. It is included as a reference size, while actual availability varies considerably between manufacturers and styles."

cups:
  - cup: "AA"
    description: "the AA starting cup step"
    context: "AA is the first cup label in the sequence used here. It represents the smallest bust-to-underbust difference in this reference sequence; it does not describe an identical physical cup across every band or brand."
  - cup: "A"
    description: "the A cup step"
    context: "A is one step above AA in the sequence. The cup letter is relative to the band, so an A cup on a 26 band and an A cup on a 52 band are not the same physical size."
  - cup: "B"
    description: "the B cup step"
    context: "B is the next cup step after A. It indicates a larger bust-to-underbust difference within the reference sequence, while the actual cup shape and dimensions still depend on the band and the bra itself."
  - cup: "C"
    description: "the C cup step"
    context: "C marks another increase in the reference cup sequence. It is best understood as part of a complete size such as 30C or 38C rather than as a universal volume category."
  - cup: "D"
    description: "the D cup step"
    context: "D is a familiar cup label, but the letter alone tells you very little about the finished cup. A 28D and a 36D use different band proportions and will not fit the same way."
  - cup: "DD"
    description: "the DD cup step"
    context: "DD is the first double-letter step in this sequence. In UK-style sizing it follows D, and the change in letter represents a change in the cup progression rather than a universal physical measurement."
  - cup: "E"
    description: "the E cup step"
    context: "E follows DD in the UK-style sequence used for this guide. Because international systems use different labels, an E should not be converted by simply keeping the same letter in another sizing system."
  - cup: "F"
    description: "the F cup step"
    context: "F is the next UK-style cup step after E. At this level, cup depth, wire width and garment construction can make a noticeable difference even when the calculated label looks right."
  - cup: "FF"
    description: "the FF cup step"
    context: "FF is a double-letter UK-style cup step between F and G. It is useful to keep the double-letter sequence intact when reading UK sizes instead of treating FF as a variation of F."
  - cup: "G"
    description: "the G cup step"
    context: "G follows FF in the UK-style sequence. The label represents a larger cup step within the same band, but it still does not predict cup shape, projection or wire width for a particular bra."
  - cup: "GG"
    description: "the GG cup step"
    context: "GG is the double-letter step after G. It can be easy to misread international conversions at this point because US and UK cup labels diverge more noticeably as the sequence continues."
  - cup: "H"
    description: "the H cup step"
    context: "H follows GG in the UK-style sequence. A size such as 34H describes a different physical cup from 40H, even though the letter is identical."
  - cup: "HH"
    description: "the HH cup step"
    context: "HH is the double-letter step after H. With larger cup labels, checking the manufacturer's own chart and the actual cup shape becomes increasingly useful rather than relying on the letter alone."
  - cup: "J"
    description: "the J cup step"
    context: "J follows HH in the UK-style sequence used here. The label indicates the next cup step, but it should never be treated as a fixed measurement shared by every manufacturer."
  - cup: "JJ"
    description: "the JJ cup step"
    context: "JJ is the double-letter step after J. It belongs to the extended UK-style sequence and is best compared using the complete band-and-cup size and the manufacturer's chart."
  - cup: "K"
    description: "the K cup step"
    context: "K is the final cup label included in this guide. Some specialist and larger-size ranges use K, while availability varies widely; the label should be treated as a sizing reference rather than a guarantee that every brand offers it."