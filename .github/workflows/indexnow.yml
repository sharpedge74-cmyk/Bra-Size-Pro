name: "IndexNow via Git Changes"

on:
  push:
    branches:
      - main  # Change to "master" if your default branch is named master
  workflow_dispatch:
    inputs:
      submit_all:
        description: 'Set to "true" to submit all sitemap URLs (ideal for first run)'
        required: false
        default: 'false'

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so manual triggers work perfectly

      - name: Extract Changed URLs & Submit
        env:
          MY_DOMAIN: "https://brasizepro.com"
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SUBMIT_ALL: ${{ github.event.inputs.submit_all }}
        run: |
          URL_LIST=""

          if [ "$SUBMIT_ALL" = "true" ]; then
            echo "Mode: Submitting ALL markdown and HTML files..."
            CHANGED_FILES=$(find . -type f -name "*.md" -o -name "*.html" | sed 's|^\./||' | grep -v '^_')
            # Also catch posts specifically
            POST_FILES=$(find _posts -type f -name "*.md" -o -name "*.html" 2>/dev/null | sed 's|^\./||' || true)
            CHANGED_FILES=$(echo -e "$CHANGED_FILES\n$POST_FILES" | grep -v '^$' | sort -u)
          else
            echo "Mode: Submitting only changed files in last commit..."
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep -E '\.(md|html)$' || true)
          fi
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No files found to submit. Skipping."
            exit 0
          fi
          
          for file in $CHANGED_FILES; do
            # Format Jekyll posts: _posts/2026-10-15-title.md -> /title/
            if [[ "$file" == _posts/* ]]; then
              clean_name=$(echo "$file" | sed -E 's|^_posts/[0-9]{4}-[0-9]{2}-[0-9]{2}-||' | sed 's/\.md$//' | sed 's/\.html$//')
              URL_LIST="$URL_LIST\"$MY_DOMAIN/$clean_name/\","
            
            # Format standard pages: contact.md -> /contact/
            elif [[ "$file" != _* && "$file" != .github* ]]; then
              clean_name=$(echo "$file" | sed 's/\.md$//' | sed 's/\.html$//' | sed 's/index$//')
              URL_LIST="$URL_LIST\"$MY_DOMAIN/$clean_name\","
            fi
          done

          URL_LIST=$(echo "$URL_LIST" | sed 's/,$//')

          if [ -z "$URL_LIST" ]; then
            echo "No live URLs could be mapped."
            exit 0
          fi

          # Send Payload to IndexNow
          curl -X POST -H "Content-Type: application/json; charset=utf-8" -d "
          {
            \"host\": \"brasizepro.com\",
            \"key\": \"$INDEXNOW_KEY\",
            \"keyLocation\": \"$MY_DOMAIN/$INDEXNOW_KEY.txt\",
            \"urlList\": [$URL_LIST]
          }
          " https://indexnow.org
