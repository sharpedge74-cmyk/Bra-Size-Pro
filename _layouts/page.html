---
layout: default
---
<div class="standard-page-container">
  <header class="standard-page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.description %}
    <p class="page-description">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="standard-page-body prose">
    {{ content }}
  </div>
</div>
