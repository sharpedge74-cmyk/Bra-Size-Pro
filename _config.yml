title: "Bra Size - Bra Size Calculators & Fit Guides"
description: "Bra size calculators, sister size conversions, fit guidance, and sizing references for US, UK, EU, AU and related sizing systems."
baseurl: ""
url: "https://Bra Size.com"
permalink: /:basename

include:
  - "_pages"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - bun.lock
  - tsconfig.json
  - vite.config.ts
  - src
  - .gitignore
  - .env.example

plugins:
  - jekyll-sitemap
  - jekyll-paginate
  - jemoji
  - jekyll-toc
  - jekyll-livereload
  - jekyll-redirect-from

sass:
  sass_dir: _sass
  style: compressed

brand:
  name: "Bra Size"
  domain: "https://Bra Size.com"
  tagline: "Independent Bra Sizing & Fit Reference"
  founding_year: 2024
